name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    # A real Postgres, so migrations and their constraints are exercised on
    # every push rather than assumed.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pocketclerk
          POSTGRES_PASSWORD: pocketclerk
          POSTGRES_DB: pocketclerk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pocketclerk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pocketclerk:pocketclerk@localhost:5432/pocketclerk
      DIRECT_URL: postgresql://pocketclerk:pocketclerk@localhost:5432/pocketclerk
      SESSION_SECRET: ci-session-secret-that-is-at-least-32-chars

    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      # .nvmrc is the single source of truth for Node, shared with local dev.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Build exactly what the lockfile pins.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed
        run: pnpm seed

      - run: pnpm test
      - run: pnpm build

  # Browser tests run as a separate job, in parallel with the checks above.
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pocketclerk
          POSTGRES_PASSWORD: pocketclerk
          POSTGRES_DB: pocketclerk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pocketclerk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pocketclerk:pocketclerk@localhost:5432/pocketclerk
      DIRECT_URL: postgresql://pocketclerk:pocketclerk@localhost:5432/pocketclerk
      SESSION_SECRET: ci-session-secret-that-is-at-least-32-chars
      # Pairing on, as in a real deployment; the suite also checks what an
      # unpaired visitor sees.
      DEVICE_CODE: ci-device-pairing-code

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Apply migrations and seed
        run: pnpm db:migrate && pnpm seed

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
