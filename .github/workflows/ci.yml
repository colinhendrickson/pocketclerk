name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    # A real Postgres, so the migration and its constraints are exercised rather
    # than assumed. The invariants in 0001 are the ones worth proving on every
    # push: they are the difference between "we check that in the app" and
    # "the database will not allow it".
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pocketclerk
          POSTGRES_PASSWORD: pocketclerk
          POSTGRES_DB: pocketclerk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pocketclerk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pocketclerk:pocketclerk@localhost:5432/pocketclerk
      DIRECT_URL: postgresql://pocketclerk:pocketclerk@localhost:5432/pocketclerk
      SESSION_SECRET: ci-session-secret-that-is-at-least-32-chars

    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      # .nvmrc is the single source of truth for Node, shared with local dev.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile so CI builds exactly what is committed. A lockfile
      # that "fixes itself" in CI is a bug you ship.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed
        run: pnpm seed

      - run: pnpm test
      - run: pnpm build
